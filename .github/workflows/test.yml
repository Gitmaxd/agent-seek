name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Offline fixtures only — no live You.com / TypeSafe keys.
      AGENT_SEEK_API_KEY: test-agent-seek-key
      YDC_API_KEY: test-ydc
      TYPESAFE_API_KEY: test-typesafe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
